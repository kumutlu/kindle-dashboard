name: One-shot public config test fix

on:
  push:
    branches:
      - codex/pw1-native-mxc-rtc
    paths:
      - '.github/workflows/one-shot-fix-public-config-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pw1-native-mxc-rtc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch stale allowlist expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test_settings_server.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_default_device_config_returns_safe_allowlisted_json(self):')
          end = text.index('\n    def test_default_device_config_inherits_global_theme_when_device_theme_missing', start)
          block = text[start:end]
          old = '                "refresh_interval_minutes",\n                "wifi_power_save",'
          new = '                "refresh_interval_minutes",\n                "scheduler",\n                "wifi_power_save",'
          if block.count(old) != 1:
              raise SystemExit(f'expected exactly one stale allowlist sequence, found {block.count(old)}')
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
      - name: Verify focused regression
        run: |
          python -m pip install pillow requests
          python -m unittest -v test_settings_server.DeviceConfigEndpointTests.test_default_device_config_returns_safe_allowlisted_json
          git diff --check
      - name: Commit the minimal fix
        run: |
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_settings_server.py
          git diff --cached --exit-code && exit 0
          git commit -m 'test: allow scheduler in public device config'
          git push origin HEAD:codex/pw1-native-mxc-rtc
