name: One-shot PW1 CI stabilization

on:
  push:
    branches:
      - codex/pw1-native-mxc-rtc-work
    paths:
      - '.github/workflows/one-shot-fix-pw1-whitespace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pw1-native-mxc-rtc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove nondeterministic host sync from Kindle script unit tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test_kindle_scripts.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        self.create_mock_bin("eips", "#!/bin/sh\\necho \\"eips $@\\" >> \\"$DASHBOARD_DIR/calls.log\\"\\n")\n'
          addition = anchor + '        self.create_mock_bin("sync", "#!/bin/sh\\nexit 0\\n")\n'
          if 'self.create_mock_bin("sync", "#!/bin/sh\\nexit 0\\n")' in text:
              raise SystemExit('sync mock already exists; refusing unexpected duplicate')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one eips setup anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Verify the previously flaky test repeatedly
        run: |
          for i in 1 2 3 4 5; do
            python -m unittest -v test_kindle_scripts.KindleScriptsTests.test_304_not_modified_repairs_stale_overlay
          done
      - name: Verify existing Kindle script suite and diff hygiene
        run: |
          python -m pip install pillow requests
          python -m unittest -v test_kindle_scripts.py
          git diff --check
      - name: Commit only the test stabilization to the PR branch
        run: |
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_kindle_scripts.py
          test "$(git diff --cached --name-only)" = "test_kindle_scripts.py"
          git commit -m 'test: isolate refresh overlay tests from host sync'
          git diff --check origin/main...HEAD
          git push origin HEAD:codex/pw1-native-mxc-rtc
