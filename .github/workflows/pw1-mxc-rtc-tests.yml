name: PW1 mxc_rtc tests

on:
  pull_request:
    paths:
      - 'kindle_scripts/**'
      - 'test_pw1_mxc_rtc.py'
      - 'test_pw1_settings_integration.py'
      - 'settings_server.py'
      - 'weather_image.py'
      - 'test_kindle_scripts.py'
      - 'test_settings_server.py'
      - '.github/workflows/pw1-mxc-rtc-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests
      - name: Shell syntax
        run: sh -n kindle_scripts/*.sh
      - name: PW1 scheduler tests
        run: python -m unittest -v test_pw1_mxc_rtc.py
      - name: Scheduler generation tests
        run: python -m unittest -v test_pw1_settings_integration.py
      - name: Existing Kindle script tests
        run: python -m unittest -v test_kindle_scripts.py
      - name: Settings server tests
        run: python -m unittest -v test_settings_server.py
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
