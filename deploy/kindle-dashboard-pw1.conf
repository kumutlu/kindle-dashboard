description "Kindle Dashboard PW1 low-power refresh service"

start on started lab126_gui

script
    [ -f /mnt/us/dashboard/DISABLE_LOW_POWER ] && exit 0
    [ -f /mnt/us/dashboard/NOAUTOSTART ] && exit 0
    exec /bin/sh /mnt/us/dashboard/pw1-low-power-cycle.sh loop >> /mnt/us/dashboard/pw1-dashboard.log 2>&1
end script
